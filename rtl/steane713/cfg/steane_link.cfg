# ============================================================================
#  steane_link.cfg — v++ link config for steane_qec_kernel (the reconstructed
#  three-mode kernel, rtl/steane713/src/steane_qec_kernel.cpp).
#  ---------------------------------------------------------------------------
#  Same convention as rtl/shor913/cfg/shor_link.cfg: this kernel is AXI-Lite
#  control plus one small m_axi output port (result_out) for hardware
#  read-back (docs/BLOCKERS.md B-001), not the HBM-pipeline architecture
#  steane_decoder_kernel.cpp (a different, unrelated kernel) uses.
#
#  Did not exist before 2026-08-20; the original archive had no source for
#  this kernel at all (docs/BLOCKERS.md B-003), so there was nothing to link.
# ============================================================================

[connectivity]
nk=steane_qec_kernel:1:steane_qec_kernel_1

# SLR0 by default, matching the Shor kernel's placement.
slr=steane_qec_kernel_1:SLR0

[clock]
freqHz=300000000:steane_qec_kernel_1.ap_clk

[vivado]
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.ARGS.DIRECTIVE=Explore
