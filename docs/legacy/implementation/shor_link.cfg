# ============================================================================
#  shor_link.cfg  —  v++ link config for shor_qec_kernel
#  ---------------------------------------------------------------------------
#  The Shor QEC kernel is AXI-Lite only: no HBM pseudo-channels, no
#  pointer arguments, nothing to map to a memory bank. That is why this
#  file is intentionally minimal and does NOT look like v05_link.cfg
#  (which has 17 `sp=` lines for its 16 HBM banks + gate buffer).
#
#  We just declare:
#    - one compute unit of shor_qec_kernel
#    - the clock
#    - a nominal SLR assignment to keep it co-located with (or adjacent
#      to) v05's quantum_simulator_kernel when they eventually share an
#      xclbin; for a standalone build any SLR is fine.
# ============================================================================

[connectivity]
nk=shor_qec_kernel:1:shor_qec_kernel_1

# Place the CU on SLR0 by default. Change to SLR1 or SLR2 if you later
# combine this with v05's kernel and want to leave its SLR uncluttered.
slr=shor_qec_kernel_1:SLR0

[clock]
freqHz=300000000:shor_qec_kernel_1.ap_clk

[vivado]
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.ARGS.DIRECTIVE=Explore
